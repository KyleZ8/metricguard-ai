[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "B",
    "C4",
    "E",
    "F",
    "I",
    "N",
    "UP",
    "W",
]
ignore = [
    "B023",
    "B905",
    "E501",
    "UP031",
]

[tool.ruff.lint.per-file-ignores]
"app/streamlit_app.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = [
    "action_engine",
    "config",
    "driver_analysis",
    "explanation_engine",
    "generate_synthetic_data",
    "metric_engine",
    "quality_checks",
    "run_pipeline",
    "streamlit_app",
    "text_theme_analysis",
]

[tool.pytest.ini_options]
markers = [
    "slow: tests that need the full synthetic data or full pipeline/app integration",
]
